# Create baseline directory structures
d /var/home/marmocc 0700 marmocc marmocc -
d /var/home/marmocc/.ssh 0700 marmocc marmocc -

# Leaning entirely into implicit systemd factory copying
C+ /etc/hostname
C+ /etc/NetworkManager/system-connections/direct.nmconnection 0600 root root -
C+ /etc/NetworkManager/system-connections/router.nmconnection 0600 root root -

# This implicitly pulls from /usr/share/factory/var/home/marmocc/.ssh/authorized_keys
C+ /var/home/marmocc/.ssh/authorized_keys 0600 marmocc marmocc -