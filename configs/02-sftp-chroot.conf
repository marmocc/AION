# SFTP subsystem with chroot
Subsystem sftp internal-sftp -f AUTHPRIV -l VERBOSE

# Shell access only for core user
Match User core
    PermitTTY yes
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding no

# SFTP-only users with chroot jail
Match User !core
    ChrootDirectory %h
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding no
    PermitUserEnvironment no
    ForceCommand internal-sftp -f AUTHPRIV -l VERBOSE