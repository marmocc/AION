name: Build AION

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

env:
  IMAGE_NAME: aion
  IMAGE_REGISTRY: ghcr.io/marmocc

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          podman build \
            --tag ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push image
        run: |
          podman push \
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest